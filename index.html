.nf-btn { font:600 13px/1 'Inter',sans-serif; padding:11px 15px; border-radius:7px; cursor:pointer;

.nf-btn:hover { background:var(--indigo-2); }
.nf-btn.ghost { background:#fff; color:var(--indigo); }

.nf-btn.red { background:var(--crimson); border-color:var(--crimson); }
.nf-btn.red:hover { background:var(--crimson-2); }
.nf-btn.sm { padding:7px 10px; font-size:12px; }
.nf-btn.xs { padding:5px 8px; font-size:11px; }
.nf-btn:disabled { opacity:.45; cursor:not-allowed; }

.nf-in { font:500 13px/1 'Inter',sans-serif; padding:10px; border:1px solid var(--line);
  border-radius:6px; background:#fff; width:100%; color:var(--sumi); }

.nf-field { display:block; margin-bottom:12px; }

  text-transform:uppercase; color:var(--mist); margin-bottom:6px; }

.nf-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }

.nf-nm { font-weight:600; font-size:14px; }
.nf-meta { font-size:11.5px; color:var(--mist); margin-top:3px; }

.nf-belt { width:36px; height:11px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.22);
  display:inline-flex; align-items:center; justify-content:flex-end; gap:2px; padding-right:2px; }

.nf-bar { height:9px; background:var(--sand); border-radius:6px; overflow:hidden; }
.nf-bar i { display:block; height:100%; background:var(--indigo); }

.nf-check { width:22px; height:22px; border-radius:5px; border:2px solid var(--line); background:#fff;

.nf-check[data-on="1"] { background:var(--ok); border-color:var(--ok); }

.nf-note { border-left:3px solid var(--crimson); background:var(--sand); padding:12px 14px;
  border-radius:0 7px 7px 0; margin-bottom:10px; }
.nf-note b { font-size:13px; }
.nf-note p { font-size:12.5px; color:var(--mist); margin-top:3px; line-height:1.5; }

/* ---------- brand marks ---------- */
.nf-seal { width:40px; height:40px; object-fit:contain; flex:none;
  background:#fff; border-radius:50%; padding:2px; }

/* ---------- landing ---------- */
.nf-land { min-height:100vh; background:#07101F; color:#fff; position:relative; overflow:hidden;
  display:grid; place-items:center; padding:56px 20px 70px; }
.nf-land-glow { position:absolute; top:-18%; left:50%; width:min(780px,140vw); height:min(780px,140vw);
  transform:translateX(-50%); border-radius:50%; pointer-events:none;

  animation:nfGlow 7s ease-in-out infinite; }
@keyframes nfGlow { 0%,100%{opacity:.75; transform:translateX(-50%) scale(1);} 50%{opacity:1; transform:translateX(-50%) scale(1.07);} }

.nf-land-inner { position:relative; z-index:2; max-width:640px; text-align:center; }

.nf-land-seal { width:132px; height:132px; object-fit:contain; display:block; margin:0 auto 26px;
  background:#fff; border-radius:50%; padding:6px;
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 18px 50px rgba(0,0,0,.6);
  animation:nfSeal 1100ms cubic-bezier(.16,.9,.3,1) both; }
@keyframes nfSeal {

  100% { opacity:1; transform:scale(1) rotate(0deg); }
}

.nf-land-word { width:min(300px,74vw); display:block; margin:0 auto 30px;

  color:#C9A227; margin-bottom:14px; animation:nfRise 700ms ease-out 900ms both; }

  text-transform:uppercase; letter-spacing:.01em; margin-bottom:16px;
  animation:nfRise 700ms ease-out 1020ms both; }
.nf-land-lede { font-size:14.5px; line-height:1.65; color:rgba(255,255,255,.7); max-width:420px;

.nf-land-cta { padding:15px 44px; font-size:14px; letter-spacing:.06em; text-transform:uppercase;

.nf-land-strip { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;

.nf-land-obi { position:absolute; left:0; right:0; bottom:0; height:6px; display:flex; z-index:2; }

  animation:nfObi 620ms ease-out both; }
.nf-land-obi i:nth-child(1){animation-delay:1300ms}.nf-land-obi i:nth-child(2){animation-delay:1360ms}
.nf-land-obi i:nth-child(3){animation-delay:1420ms}.nf-land-obi i:nth-child(4){animation-delay:1480ms}
.nf-land-obi i:nth-child(5){animation-delay:1540ms}.nf-land-obi i:nth-child(6){animation-delay:1600ms}
.nf-land-obi i:nth-child(7){animation-delay:1660ms}.nf-land-obi i:nth-child(8){animation-delay:1720ms}
.nf-land-obi i:nth-child(9){animation-delay:1780ms}.nf-land-obi i:nth-child(10){animation-delay:1840ms}
@keyframes nfObi { to { transform:scaleX(1); } }

.nf-login-seal { width:76px; height:76px; object-fit:contain; display:block; margin:0 auto 14px; }
.nf-login-word { width:190px; display:block; margin:0 auto 4px; }

.nf-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.nf-tbl th { text-align:left; font:700 10.5px/1 'Inter',sans-serif; letter-spacing:.12em;
  text-transform:uppercase; color:var(--mist); padding:10px 8px; border-bottom:1px solid var(--line); }
.nf-tbl td { padding:11px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
.nf-tbl tr:last-child td { border-bottom:0; }
.nf-tbl td.num, .nf-tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.nf-scroll { overflow-x:auto; }

.nf-panel { background:var(--sand); border-radius:8px; padding:14px; margin-top:12px; }

.nf-login { min-height:100vh; display:grid; place-items:center; padding:32px 18px;
  background:linear-gradient(160deg,var(--indigo) 0%,#0A1D3A 100%); }
.nf-login-box { width:100%; max-width:440px; background:var(--ivory); border-radius:14px;
  overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.35); }
.nf-login-hd { padding:30px 26px 22px; text-align:center; }
.nf-login-hd h1 { font-size:27px; text-transform:uppercase; color:var(--indigo); line-height:1.05; }
.nf-login-hd p { font-size:12px; color:var(--mist); margin-top:8px; letter-spacing:.13em;
  text-transform:uppercase; font-weight:600; }
.nf-pick { border:1px solid var(--line); background:#fff; border-radius:9px; padding:14px;
  display:flex; align-items:center; gap:13px; cursor:pointer; width:100%; text-align:left; margin-bottom:9px; }
.nf-pick:hover { border-color:var(--indigo); background:var(--sand); }
.nf-pick .ico { width:38px; height:38px; border-radius:8px; flex:none; display:grid; place-items:center;
  font-family:'Oswald',sans-serif; font-size:16px; color:#fff; background:var(--indigo); }
.nf-pick .ico.r { background:var(--crimson); }
.nf-pick b { display:block; font-size:14.5px; }
.nf-pick span { display:block; font-size:11.5px; color:var(--mist); margin-top:2px; line-height:1.4; }

.nf-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:99;
  background:var(--sumi); color:#fff; padding:13px 20px; border-radius:8px;

@media (max-width:620px){
  .nf-top { padding:11px 14px; gap:10px; }
  .nf-brand { font-size:16px; }
  .nf-who { display:none; }

  .nf-stat { font-size:27px; }
