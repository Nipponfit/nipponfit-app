@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap');

.nf * { box-sizing:border-box; margin:0; padding:0; }
.nf {
  --indigo:#12305B; --indigo-2:#1D4479; --crimson:#B01015; --crimson-2:#8E0C10;
  --ivory:#FFFDF2; --sand:#F3EEE0; --sumi:#1A1917; --mist:#6B6A66; --line:#E3DCCB;
  --ok:#1F7A4C; --warn:#C2760B;
  font-family:'Inter',system-ui,sans-serif; color:var(--sumi);
  background:var(--ivory); min-height:100%; -webkit-font-smoothing:antialiased;
}
.nf h1,.nf h2,.nf h3 { font-family:'Oswald',Impact,sans-serif; font-weight:600; letter-spacing:.01em; }

.nf-wrap { max-width:1180px; margin:0 auto; padding:0 0 96px; }
.nf-top { position:sticky; top:0; z-index:30; background:var(--indigo); color:#fff;
  padding:14px 18px; display:flex; align-items:center; gap:14px; }
.nf-brand { font-family:'Oswald',sans-serif; font-size:19px; line-height:1.05; text-transform:uppercase; }
.nf-brand small { display:block; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:500;
  letter-spacing:.18em; opacity:.72; margin-top:2px; }
.nf-role { margin-left:auto; display:flex; align-items:center; gap:10px; }
.nf-who { text-align:right; font-size:12px; line-height:1.3; }
.nf-who b { display:block; font-size:13px; }
.nf-who span { opacity:.7; }
.nf-switch { background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.3); color:#fff;
  font:600 12px/1 'Inter',sans-serif; padding:9px 12px; border-radius:6px; cursor:pointer; }
.nf-switch:hover { background:rgba(255,255,255,.24); }

.nf-obi { height:7px; display:flex; }
.nf-obi i { flex:1; }

.nf-tabs { display:flex; gap:2px; background:var(--sand); border-bottom:1px solid var(--line);
  overflow-x:auto; position:sticky; top:66px; z-index:20; }
.nf-tab { flex:none; background:none; border:0; border-bottom:3px solid transparent; cursor:pointer;
  font:600 12.5px/1 'Inter',sans-serif; color:var(--mist); padding:14px 16px; white-space:nowrap;
  text-transform:uppercase; letter-spacing:.07em; }
.nf-tab[data-on="1"] { color:var(--indigo); border-bottom-color:var(--crimson); background:var(--ivory); }

.nf-pad { padding:20px 18px; }
.nf-grid { display:grid; gap:14px; }
.g2 { grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); }
.g3 { grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); }
.g4 { grid-template-columns:repeat(auto-fit,minmax(155px,1fr)); }

.nf-card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; }
.nf-card.tight { padding:14px; }
.nf-card.flag { border-left:4px solid var(--crimson); }
.nf-h { font-size:20px; text-transform:uppercase; margin-bottom:3px; }
.nf-h3 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; }
.nf-sub { font-size:13px; color:var(--mist); line-height:1.5; }
.nf-sec { margin-bottom:26px; }

.nf-stat { font-family:'Oswald',sans-serif; font-size:33px; line-height:1; color:var(--indigo); }
.nf-stat.red { color:var(--crimson); }
.nf-stat.green { color:var(--ok); }
.nf-lab { font-size:11.5px; color:var(--mist); margin-top:6px; letter-spacing:.04em; }

.nf-pill { display:inline-block; font:600 10.5px/1 'Inter',sans-serif; padding:5px 9px;
  border-radius:20px; letter-spacing:.06em; text-transform:uppercase; }
.p-ok { background:#E6F3EC; color:var(--ok); }
.p-due { background:#FDF0DC; color:var(--warn); }
.p-late { background:#FBE7E7; color:var(--crimson); }
.p-info { background:#E9EEF6; color:var(--indigo); }
.p-mute { background:var(--sand); color:var(--mist); }

.nf-medal { display:inline-block; color:#fff; font:700 10px/1 'Inter',sans-serif; padding:6px 10px;
  border-radius:20px; letter-spacing:.08em; text-transform:uppercase; flex:none; }

.nf-btn { font:600 13px/1 'Inter',sans-serif; padding:11px 15px; border-radius:7px; cursor:pointer;
  border:1px solid var(--indigo); background:var(--indigo); color:#fff; display:inline-block;
  text-decoration:none; text-align:center; }
.nf-btn:hover { background:var(--indigo-2); }
.nf-btn.ghost { background:#fff; color:var(--indigo); }
.nf-btn.ghost:hover { background:var(--sand); }
.nf-btn.red { background:var(--crimson); border-color:var(--crimson); }
.nf-btn.red:hover { background:var(--crimson-2); }
.nf-btn.sm { padding:7px 10px; font-size:12px; }
.nf-btn.xs { padding:5px 8px; font-size:11px; }
.nf-btn:disabled { opacity:.45; cursor:not-allowed; }

.nf-in { font:500 13px/1 'Inter',sans-serif; padding:10px; border:1px solid var(--line);
  border-radius:6px; background:#fff; width:100%; color:var(--sumi); }
.nf-in.sm { padding:7px 8px; font-size:12px; }
.nf-field { display:block; margin-bottom:12px; }
.nf-field > span { display:block; font:600 11px/1 'Inter',sans-serif; letter-spacing:.1em;
  text-transform:uppercase; color:var(--mist); margin-bottom:6px; }

.nf-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); flex-wrap:wrap; }
.nf-row:last-child { border-bottom:0; }
.nf-row .grow { flex:1; min-width:150px; }
.nf-nm { font-weight:600; font-size:14px; }
.nf-meta { font-size:11.5px; color:var(--mist); margin-top:3px; }

.nf-belt { width:36px; height:11px; border-radius:2px; flex:none; border:1px solid rgba(0,0,0,.22);
  display:inline-flex; align-items:center; justify-content:flex-end; gap:2px; padding-right:2px; }
.nf-belt em { width:2px; height:7px; background:rgba(255,255,255,.85); display:block; }

.nf-bar { height:9px; background:var(--sand); border-radius:6px; overflow:hidden; }
.nf-bar i { display:block; height:100%; background:var(--indigo); }
.nf-bar i.red { background:var(--crimson); }

.nf-check { width:22px; height:22px; border-radius:5px; border:2px solid var(--line); background:#fff;
  cursor:pointer; flex:none; display:grid; place-items:center; color:#fff; font-size:13px; font-weight:700; }
.nf-check[data-on="1"] { background:var(--ok); border-color:var(--ok); }

.nf-note { border-left:3px solid var(--crimson); background:var(--sand); padding:12px 14px;
  border-radius:0 7px 7px 0; margin-bottom:10px; }
.nf-note b { font-size:13px; }
.nf-note p { font-size:12.5px; color:var(--mist); margin-top:3px; line-height:1.5; }

/* ---------- brand marks ---------- */
.nf-seal { width:40px; height:40px; object-fit:contain; flex:none;
  background:#fff; border-radius:50%; padding:2px; }

/* ---------- landing ---------- */
.nf-land { min-height:100vh; background:#07101F; color:#fff; position:relative; overflow:hidden;
  display:grid; place-items:center; padding:56px 20px 70px; }
.nf-land-glow { position:absolute; top:-18%; left:50%; width:min(780px,140vw); height:min(780px,140vw);
  transform:translateX(-50%); border-radius:50%; pointer-events:none;
  background:radial-gradient(circle, rgba(176,16,21,.34) 0%, rgba(176,16,21,.10) 42%, transparent 68%);
  animation:nfGlow 7s ease-in-out infinite; }
@keyframes nfGlow { 0%,100%{opacity:.75; transform:translateX(-50%) scale(1);} 50%{opacity:1; transform:translateX(-50%) scale(1.07);} }

.nf-land-inner { position:relative; z-index:2; max-width:640px; text-align:center; }

.nf-land-seal { width:96px; height:96px; object-fit:contain; display:block; margin:0 auto 28px;
  background:#fff; border-radius:50%; padding:5px;
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 14px 38px rgba(0,0,0,.55);
  animation:nfSeal 1000ms cubic-bezier(.16,.9,.3,1) 640ms both; }
@keyframes nfSeal {
  0%   { opacity:0; transform:scale(.55) rotate(-150deg); }
  60%  { opacity:1; }
  100% { opacity:1; transform:scale(1) rotate(0deg); }
}

.nf-land-word { width:min(330px,80vw); display:block; margin:0 auto 22px;
  animation:nfRise 900ms ease-out 60ms both; }

.nf-land-kicker { font:700 11px/1 'Inter',sans-serif; letter-spacing:.34em; text-transform:uppercase;
  color:#C9A227; margin-bottom:14px; animation:nfRise 700ms ease-out 900ms both; }
.nf-land-h1 { font-family:'Oswald',sans-serif; font-size:clamp(34px,7.4vw,58px); line-height:1.02;
  text-transform:uppercase; letter-spacing:.01em; margin-bottom:16px;
  animation:nfRise 700ms ease-out 1020ms both; }
.nf-land-lede { font-size:14.5px; line-height:1.65; color:rgba(255,255,255,.7); max-width:420px;
  margin:0 auto 30px; animation:nfRise 700ms ease-out 1140ms both; }
.nf-land-cta { padding:15px 44px; font-size:14px; letter-spacing:.06em; text-transform:uppercase;
  animation:nfRise 700ms ease-out 1260ms both; }

.nf-land-strip { display:flex; align-items:center; justify-content:center; gap:12px; flex-wrap:wrap;
  margin-top:38px; font:600 10.5px/1.6 'Inter',sans-serif; letter-spacing:.16em;
  text-transform:uppercase; color:rgba(255,255,255,.42);
  animation:nfRise 700ms ease-out 1400ms both; }
.nf-land-strip i { width:3px; height:3px; border-radius:50%; background:rgba(255,255,255,.3); }

@keyframes nfRise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }

.nf-land-obi { position:absolute; left:0; right:0; bottom:0; height:6px; display:flex; z-index:2; }
.nf-land-obi i { flex:1; transform:scaleX(0); transform-origin:left;
  animation:nfObi 620ms ease-out both; }
.nf-land-obi i:nth-child(1){animation-delay:1300ms}.nf-land-obi i:nth-child(2){animation-delay:1360ms}
.nf-land-obi i:nth-child(3){animation-delay:1420ms}.nf-land-obi i:nth-child(4){animation-delay:1480ms}
.nf-land-obi i:nth-child(5){animation-delay:1540ms}.nf-land-obi i:nth-child(6){animation-delay:1600ms}
.nf-land-obi i:nth-child(7){animation-delay:1660ms}.nf-land-obi i:nth-child(8){animation-delay:1720ms}
.nf-land-obi i:nth-child(9){animation-delay:1780ms}.nf-land-obi i:nth-child(10){animation-delay:1840ms}
@keyframes nfObi { to { transform:scaleX(1); } }

.nf-login-word { width:200px; display:block; margin:0 auto 10px; }
.nf-login-seal { width:58px; height:58px; object-fit:contain; display:block; margin:0 auto 6px; }

.nf-tbl { width:100%; border-collapse:collapse; font-size:13px; }
.nf-tbl th { text-align:left; font:700 10.5px/1 'Inter',sans-serif; letter-spacing:.12em;
  text-transform:uppercase; color:var(--mist); padding:10px 8px; border-bottom:1px solid var(--line); }
.nf-tbl td { padding:11px 8px; border-bottom:1px solid var(--line); vertical-align:middle; }
.nf-tbl tr:last-child td { border-bottom:0; }
.nf-tbl td.num, .nf-tbl th.num { text-align:right; font-variant-numeric:tabular-nums; }
.nf-scroll { overflow-x:auto; }

.nf-panel { background:var(--sand); border-radius:8px; padding:14px; margin-top:12px; }

.nf-login { min-height:100vh; display:grid; place-items:center; padding:32px 18px;
  background:linear-gradient(160deg,var(--indigo) 0%,#0A1D3A 100%); }
.nf-login-box { width:100%; max-width:440px; background:var(--ivory); border-radius:14px;
  overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.35); }
.nf-login-hd { padding:30px 26px 22px; text-align:center; }
.nf-login-hd h1 { font-size:27px; text-transform:uppercase; color:var(--indigo); line-height:1.05; }
.nf-login-hd p { font-size:12px; color:var(--mist); margin-top:8px; letter-spacing:.13em;
  text-transform:uppercase; font-weight:600; }
.nf-pick { border:1px solid var(--line); background:#fff; border-radius:9px; padding:14px;
  display:flex; align-items:center; gap:13px; cursor:pointer; width:100%; text-align:left; margin-bottom:9px; }
.nf-pick:hover { border-color:var(--indigo); background:var(--sand); }
.nf-pick .ico { width:38px; height:38px; border-radius:8px; flex:none; display:grid; place-items:center;
  font-family:'Oswald',sans-serif; font-size:16px; color:#fff; background:var(--indigo); }
.nf-pick .ico.r { background:var(--crimson); }
.nf-pick b { display:block; font-size:14.5px; }
.nf-pick span { display:block; font-size:11.5px; color:var(--mist); margin-top:2px; line-height:1.4; }

.nf-toast { position:fixed; left:50%; transform:translateX(-50%); bottom:24px; z-index:99;
  background:var(--sumi); color:#fff; padding:13px 20px; border-radius:8px;
  font:600 13px/1.4 'Inter',sans-serif; box-shadow:0 10px 30px rgba(0,0,0,.3); max-width:90%; }

@media (max-width:620px){
  .nf-top { padding:11px 14px; gap:10px; }
  .nf-brand { font-size:16px; }
  .nf-who { display:none; }
  .nf-pad { padding:16px 14px; }
  .nf-stat { font-size:27px; }
  .nf-tabs { top:60px; }
}
@media (prefers-reduced-motion:reduce){
  .nf * { transition:none !important; }
  .nf-land-seal,.nf-land-word,.nf-land-kicker,.nf-land-h1,.nf-land-lede,.nf-land-cta,
  .nf-land-strip,.nf-land-glow { animation:none !important; opacity:1 !important; transform:none !important; }
  .nf-land-obi i { animation:none !important; transform:scaleX(1) !important; }
