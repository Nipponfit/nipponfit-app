<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Nippon Fit — Dojo Manager</title>
<meta name="description" content="Nippon Karate Club — attendance, fees, grading and medals." />
<meta name="theme-color" content="#0a1533" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="styles.css" />

<!-- Your Supabase address and key. The only file you ever edit. -->
<script src="config.js"></script>

<script>
/* Escape hatch: app.nipponfit.com/?reset signs you out, clears the saved
   app and returns you to the start. Kept from the old app because it is
   the one thing that can always get you unstuck. */
(function () {
  if (location.search.indexOf("reset") === -1) return;
  try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
  if (navigator.serviceWorker?.getRegistrations) {
    navigator.serviceWorker.getRegistrations().then(function (rs) {
      rs.forEach(function (r) { r.unregister(); });
    });
  }
  if (window.caches?.keys) {
    caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
  }
  setTimeout(function () { location.replace("/"); }, 400);
})();
</script>

<script>
/* If anything goes wrong, say so on screen rather than showing nothing. */
window.addEventListener("error", function (e) { window.__nfShowError?.(e.message, e.filename, e.lineno); });
window.addEventListener("unhandledrejection", function (e) { window.__nfShowError?.(e.reason?.message || String(e.reason)); });
</script>
</head>

<body>
<div id="root"></div>

<noscript>
  <p style="color:#fff;padding:20px;font-family:sans-serif">
    This app needs JavaScript switched on.
  </p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
