<!doctype html>
<meta charset="utf-8">
<title>Nippon Fit</title>
<meta http-equiv="refresh" content="0; url=/">
<link rel="canonical" href="/">
<style>
  body { font-family: system-ui, sans-serif; background: #f2ece1; color: #2b2118;
         display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; }
  a { color: #8b1a1a; }
</style>
<div>
  <p>Nippon Fit has moved.</p>
  <p><a href="/">Open the app</a></p>
</div>
<script>
  /* An old copy of the app may still be installed on this phone from
     when this address was the live one. Clear it out, then go to the
     real app, so nobody is left running a version from months ago. */
  (async () => {
    try {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map((r) => r.unregister()));
      const keys = await caches.keys();
      await Promise.all(keys.map((k) => caches.delete(k)));
    } catch (e) { /* nothing to clear */ }
    location.replace("/");
  })();
</script>
